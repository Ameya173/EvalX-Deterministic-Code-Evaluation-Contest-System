# Full stack for a server or a single machine:  docker compose up -d --build
# Needs a .env file (copy .env.example). See docs/DEPLOY.md.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["jb_mongo:/data/db"]
    # not published: only reachable inside the compose network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["jb_redis:/data"]

  # Builds the sandbox image once (toolchains + C runner + agent); exits immediately afterwards.
  sandbox-image:
    build: ./sandbox
    image: judgebox-sandbox
    entrypoint: ["true"]
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/judgebox
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: ${PUBLIC_URL:-http://localhost}
    depends_on: [mongo, redis]

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/judgebox
      REDIS_URL: redis://redis:6379
    volumes:
      # The worker starts one hardened sandbox container per submission through the Docker API.
      # Access to this socket is equivalent to root on the host: run the worker on a dedicated machine.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo: { condition: service_started }
      redis: { condition: service_started }
      sandbox-image: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: [api]

  # Optional automatic HTTPS:  docker compose --profile https up -d --build   (set DOMAIN, WEB_PORT=8080)
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - jb_caddy_data:/data
    depends_on: [web]

volumes:
  jb_mongo:
  jb_redis:
  jb_caddy_data:
